id: "FSTEC-LOGGING-2025-APPENDIX2-LINUX-4-AUDIT-RULES"
layer: "fstec-core"
profile: null
source:
  index_id: "SRC-0053"
  doc_id: "fstec-logging-2025"
  doc_sha256: "2db44a4eebf1ec87986e0aea43f7b1c907e4ef21c052f01a2879e6d458a28a64"
  locator: "appendix2-linux:4"
  quote: "4. Настройку правил регистрации событий безопасности необходимо осуществлять используя утилиту auditctl. Наборы правил содержатся в файлах /etc/audit/audit.rules и /etc/audit/rules.d/*.rules. В таблице 1 представлены примеры правил для осуществления регистрации событий в операционных системах Linux. Таблица 1. Примеры рекомендуемых настроек регистрации событий безопасности Категория Отслеживание изменений в директории или файле Аудит пользователей, групп, базы данных паролей Аудит изменений в файле Sudoers Аудит паролей Правила sudo auditctl -w /var/log -p w -k var_log_changes sudo auditctl -w /etc/group -p wa -k etcgroup sudo auditctl -w /etc/passwd -p wa -k etcpasswd sudo auditctl -w /etc/gshadow -k etcgroup sudo auditctl -w /etc/shadow -k etcpasswd sudo auditctl -w /etc/security/opasswd -k opasswd sudo auditctl -w /etc/adduser.conf -k adduserconf sudo auditctl -w /etc/sudoers -p wa -k actions sudo auditctl -w /usr/bin/passwd -p x -k passwd_modification Категория Аудит изменения идентификаторов групп Аудит конфигурации и входов Отслеживание запуска определенного приложения Отслеживание системных вызовов Отслеживание сетевых подключений Запись в журнал аудита при подключении устройства USB Правила sudo auditctl -w /usr/bin/gpasswd -p x -k gpasswd_modification sudo auditctl -w /usr/sbin/groupadd -p x -k group_modification sudo auditctl -w /usr/sbin/groupmod -p x -k group_modification sudo auditctl -w /usr/sbin/addgroup -p x -k group_modification sudo auditctl -w /usr/sbin/useradd -p x -k user_modification sudo auditctl -w /usr/sbin/usermod -p x -k user_modification sudo auditctl -w /usr/sbin/adduser -p x -k user_modification sudo auditctl -w /etc/login.defs -p wa -k login sudo auditctl -w /etc/securetty -p wa -k login sudo auditctl -w /var/log/faillog -p wa -k login sudo auditctl -w /var/log/lastlog -p wa -k login sudo auditctl -w /var/log/tallylog -p wa -k login sudo auditctl -a exit,always -F path=/usr/bin/myapp -F perm=x -k myapp_execution sudo auditctl -a exit,always -F arch=b64 -S execve -F uid=0 -k authentication_events sudo auditctl -a exit,always -F arch=b32 -S execve -F uid=0 -k authentication_events sudo auditctl -a exit,always -F arch=b64 -S bind -S connect -F success=0 -k network_events sudo auditctl -w /dev/bus/usb -p rwxa -k usb"
  quote_sha256: "e2f6793302a08482b131be9de48d895e139103ed28a598a75ba09b6cdbee212e"
  norm: "norm-v1"
requirement:
  stated: "4. Настройку правил регистрации событий безопасности необходимо осуществлять используя утилиту auditctl. Наборы правил содержатся в файлах /etc/audit/audit.rules и /etc/audit/rules.d/*.rules. В таблице 1 представлены примеры правил для осуществления регистрации событий в операционных системах Linux. Таблица 1. Примеры рекомендуемых настроек регистрации событий безопасности Категория Отслеживание изменений в директории или файле Аудит пользователей, групп, базы данных паролей Аудит изменений в файле Sudoers Аудит паролей Правила sudo auditctl -w /var/log -p w -k var_log_changes sudo auditctl -w /etc/group -p wa -k etcgroup sudo auditctl -w /etc/passwd -p wa -k etcpasswd sudo auditctl -w /etc/gshadow -k etcgroup sudo auditctl -w /etc/shadow -k etcpasswd sudo auditctl -w /etc/security/opasswd -k opasswd sudo auditctl -w /etc/adduser.conf -k adduserconf sudo auditctl -w /etc/sudoers -p wa -k actions sudo auditctl -w /usr/bin/passwd -p x -k passwd_modification Категория Аудит изменения идентификаторов групп Аудит конфигурации и входов Отслеживание запуска определенного приложения Отслеживание системных вызовов Отслеживание сетевых подключений Запись в журнал аудита при подключении устройства USB Правила sudo auditctl -w /usr/bin/gpasswd -p x -k gpasswd_modification sudo auditctl -w /usr/sbin/groupadd -p x -k group_modification sudo auditctl -w /usr/sbin/groupmod -p x -k group_modification sudo auditctl -w /usr/sbin/addgroup -p x -k group_modification sudo auditctl -w /usr/sbin/useradd -p x -k user_modification sudo auditctl -w /usr/sbin/usermod -p x -k user_modification sudo auditctl -w /usr/sbin/adduser -p x -k user_modification sudo auditctl -w /etc/login.defs -p wa -k login sudo auditctl -w /etc/securetty -p wa -k login sudo auditctl -w /var/log/faillog -p wa -k login sudo auditctl -w /var/log/lastlog -p wa -k login sudo auditctl -w /var/log/tallylog -p wa -k login sudo auditctl -a exit,always -F path=/usr/bin/myapp -F perm=x -k myapp_execution sudo auditctl -a exit,always -F arch=b64 -S execve -F uid=0 -k authentication_events sudo auditctl -a exit,always -F arch=b32 -S execve -F uid=0 -k authentication_events sudo auditctl -a exit,always -F arch=b64 -S bind -S connect -F success=0 -k network_events sudo auditctl -w /dev/bus/usb -p rwxa -k usb"
  derived: true
  justification: "Источник требует настраивать правила регистрации событий в /etc/audit/audit.rules и /etc/audit/rules.d/*.rules и приводит таблицу 1 примеров правил. Решение пользователя 30.09.2026 (вариант B, карта разбиения auditd v5): 25 правил таблицы 1 без примера myapp (отслеживание запуска определённого приложения) — один контроль на весь набор. Карта v6 (решение пользователя 01.10.2026): правило в файлах rules.d/*.rules — в написании таблицы 1 или в нормализованном виде вывода auditctl -l, в ядре — нормализованный вид; набор пишется в /etc/audit/rules.d/50-securelinux-policy.rules и загружается augenrules --load."
  applicability: "technical"
parameter:
  kind: "auditd-rules"
  locator: "/etc/audit/rules.d"
  key: "table1"
expected:
  op: "eq"
  value: "present"
  type: "string"
apply:
  supported: true
