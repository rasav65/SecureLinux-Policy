  justification: "Источник требует обеспечить размер хранилищ журналов событий, достаточный для их полноценного анализа, без значения. Решение пользователя 30.09.2026 (карта разбиения auditd v5/v6): контроль только CHECK — в файловой системе каталога /var/log/audit доступно не менее 7 GiB (7·2^30 байт): оценка объёма журнала auditd за три месяца по замеру 30.09.2026 (правила таблицы 1, без правила п.10.5) с запасом; серверы компании — 60–100 GB. APPLY нет: размер диска — решение администратора; FAIL на тестовых ВМ с меньшим свободным местом — ожидаемое поведение."
