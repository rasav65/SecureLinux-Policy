  quote: "2.4.1. Ограничить доступ к журналу ядра путём установки значения sysctl- опции kernel.dmesg_restrict=1. Журнал ядра должен быть доступен только пользователям, которые обладают разрешением CAP_SYSLOG (администраторы системы)."
