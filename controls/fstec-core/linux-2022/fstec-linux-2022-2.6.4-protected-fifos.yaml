  locator: "2.6.4"
  quote: "2.6.4. Включить защиту от непреднамеренной записи в FIFO-объект путём установки значения sysctl-опции fs.protected_fifos=2. Данная настройка не влияет на нормальную функциональность userspace и блокирует только вредоносное поведение."
  quote_sha256: "016aaaf884c10febb3e99a86acfcbe63eae04f05f5fcf35a00c59f03fb30a31b"
