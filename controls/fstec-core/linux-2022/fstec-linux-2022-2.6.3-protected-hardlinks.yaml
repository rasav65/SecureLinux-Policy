  locator: "2.6.3"
  quote: "2.6.3. Ограничить небезопасные варианты работы с жесткими ссылками (hardlinks) путём установки значения sysctl-опции fs.protected_hardlinks=1. Данная настройка не влияет на нормальную функциональность userspace и блокирует только вредоносное поведение."
  quote_sha256: "315736677a4e3192cde79d4badbf20809da81c8605785c8720fcd0fc3260fe97"
  norm: "norm-v1"
