id: "FSTEC-LINUX-2022-2.2.1-SU-WHEEL-ACCESS"
layer: "fstec-core"
profile: null
source:
  index_id: "SRC-0003"
  doc_id: "fstec-linux-2022"
  doc_sha256: "350f00669436b1d505499b41f1f069bde335e5845441f8985209e1844620967d"
  locator: "2.2.1"
  quote: "2.2.1. Обеспечить ограничение доступа к команде su путём добавления в файл /etc/pam.d/su следующей строки: auth required pam_wheel.so use_uid. Задать список пользователей в записи для группы wheel в файле /etc/group: wheel:x:10:root,<user list>."
  quote_sha256: "25dd0790262b44e6c787ec36df8c1aabb8b2f8f3e50d6c9bed83285c50c64c62"
  norm: "norm-v1"
requirement:
  stated: "2.2.1. Обеспечить ограничение доступа к команде su путём добавления в файл /etc/pam.d/su следующей строки: auth required pam_wheel.so use_uid. Задать список пользователей в записи для группы wheel в файле /etc/group: wheel:x:10:root,<user list>."
  derived: true
  justification: "Источник задаёт строку auth required pam_wheel.so use_uid в /etc/pam.d/su и запись wheel с root в /etc/group; <user list> — решение администратора и не оценивается, номер 10 не требуется (на всех семи средах gid 10 занят группой uucp), authority-файл не читается (решение 23.09.2026)."
  applicability: "technical"
parameter:
  kind: "pam-wheel-access"
  locator: "/etc/pam.d/su|/etc/group"
  key: "policy"
expected:
  op: "pam-wheel-root-member"
  value: "auth required pam_wheel.so use_uid;wheel:root"
  type: "string"
apply:
  supported: false
