  locator: "2.6.2"
  quote: "2.6.2. Ограничить небезопасные варианты прохода по символическим ссылкам (symlinks) путём установки значения sysctl-опции fs.protected_symlinks=1. Данная настройка не влияет на нормальную функциональность userspace и блокирует только вредоносное поведение."
  quote_sha256: "ce09b5104160f3fe27f17f1d5e57a5fe81001adac3c362ed652552ccbc59571f"
