  derived: true
  justification: "П.1.1 для Debian/Ubuntu рекомендует строку password requisite pam_pwquality.so retry=3 minlen=15 ucredit=-1 lcredit=-1 dcredit=-1 ocredit=-1 в /etc/pam.d/common-password или параметры в /etc/security/pwquality.conf. Решение пользователя 26.09.2026 (политика компании, методический документ ФСТЭК: пароль не менее 12 символов): по контролю на параметр; minlen не менее 12, ucredit, lcredit, dcredit, ocredit = -1, retry = 3; пакет libpam-pwquality ставится; значение — действующее для модуля pam_pwquality (аргумент модуля, иначе pwquality.conf.d и pwquality.conf, иначе значение по умолчанию)."
  applicability: "technical"
parameter:
  kind: "pam-pwquality-option"
  locator: "/etc/pam.d/common-password|/etc/security/pwquality.conf"
  key: "ocredit"
expected:
  op: "eq"
  value: -1
  type: "integer"
apply:
  supported: true
