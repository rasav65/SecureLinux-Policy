id: "FSTEC-CONFIGURATION-2026-1.1-PWQUALITY-OCREDIT"
layer: "fstec-core"
profile: null
source:
  index_id: "SRC-0055"
  doc_id: "fstec-configuration-2026"
  doc_sha256: "1f2e53a3c047cd1a21f2f99e8605f7ba7a7680a45fc332b8236199b049c3dad6"
  locator: "1.1"
  quote: "1.1 Установить парольную политику на уровне операционной системы и обеспечить обязательную сложность паролей. Для операционных систем Windows. Рекомендуется установить политику паролей с использованием утилиты gpedit.msc на уровне локального компьютера или через Group Policy Object (GPO) в домене (в случае использования Active Directory). Для запуска редактора локальной групповой политики необходимо нажать сочетание клавиш на клавиатуре «Win» + «R», в открывшемся окне ввести «gpedit.msc» и нажать клавишу «Enter». В открывшемся окне редактора локальной групповой политики необходимо перейти в разделы «Конфигурация компьютера» - «Конфигурация Windows» - «Параметры безопасности» - «Политика учетных записей» - «Политика паролей». Установить в разделе «Политика паролей» параметры, представленные в таблице 1. Таблица 1. Параметр Значение Пароль должен отвечать требованиям Включить — требует минимум: 1 сложности строчную, заглавную, цифру, спецсимвол Минимальная длина пароля Рекомендуется ≥ умолчанию — 0) 15 символов (по Максимальный срок действия пароля 60–90 дней (обязывает менять пароль периодически) Минимальный срок действия пароля 1–2 дня (чтобы избежать мгновенной смены на старый) История паролей Не менее 5–10 (запрещает повторное использование) Хранить пароли, используя обратимое Отключить (иначе существует шифрование возможность расшифровать пароль) Для применения настроек необходимо открыть командную строку операционной системы от имени администратора и ввести команду «gpupdate /force» для применения новой групповой политики. Для проверки текущих локальных политик рекомендуется использовать утилиту «secpol.msc», или команду «net accounts». Для операционных систем на базе Linux. Рекомендуется установить политику паролей с использованием файла /etc/login.defs или модулей Pluggable Authentication Modules (PAM). Файл /etc/login.defs используется системными утилитами, такими как passwd, useradd, для определения базовых правил политики. Чтобы открыть указанный файл необходимо выполнить следующую команду в терминале (командной строки) операционной системы: sudo nano /etc/login.defs. В открывшемся редакторе «Nano» установить параметры, представленные в таблице 2. Таблица 2. Параметр Назначение Рекомендованное значение PASS_MAX_DAYS Максимальный действия пароля срок 90 PASS_MIN_DAYS Минимальное число дней 1–7 между сменами пароля PASS_WARN_AGE За сколько дней до 7–14 истечения срока показать предупреждение PASS_MIN_LEN Минимальная длина пароля 15 (не во всех дистрибутивах) ENCRYPT_METHOD Метод шифрования пароля SHA512 или YESCRYPT (SHA512, YESCRYPT, BCRYPT) После внесения изменений необходимо сохранить файл и перезапустить терминал (в некоторых случая понадобится заново создать пользователей), чтобы параметры применились. Файл /etc/login.defs не всегда гарантирует строгую проверку парольной политики. В качестве усиления проверки парольной политики рекомендуется использовать следующие модули «pam_pwquality» или «pam_cracklib» (в зависимости от дистрибутива). Расположение конфигураций модулей зависит от дистрибутива: для Debian/Ubuntu-подобных систем: /etc/pam.d/common-password; для RHEL/CentOS/Rocky-подобных систем: /etc/pam.d/system-auth или /etc/security/pwquality.conf. Для применения парольных политик необходимо добавить следующие строки в файлы конфигурации модулей: password requisite pam_pwquality.so retry=3 minlen=15 ucredit=-1 lcredit=-1 dcredit=-1 ocredit=-1, где retry=3 — попытки ввода пароля, minlen=15 — минимальная длина пароля, ucredit=-1 — минимум 1 заглавная буква, lcredit=-1 — минимум 1 строчная буква, dcredit=-1 — минимум 1 цифра, ocredit=-1 — минимум 1 спецсимвол. Для RHEL-подобных систем настройка может быть выполнена через утилиту «authselect» или ручное редактирование файла конфигурации /etc/security/pwquality.conf с аналогичными параметрами. Для проверки действия политики необходимо создать нового пользователя и попытаться задать слабый пароль, в случае отклонения слабого пароля, политика применена и работает. Для дополнительного усиления рекомендуется применять политику блокировки входа после неудачных попыток. Для этого необходимо установить утилиты «pam_tally2» или «pam_faillock» (в зависимости от дистрибутива) и добавьте в PAM-конфигурацию следующие строки, например для RHEL-подобных систем: auth required pam_faillock.so preauth audit silent deny=5 unlock_time=900 auth [default=die] pam_faillock.so authfail audit deny=5 unlock_time=900."
  quote_sha256: "5d69bd0dac34a0629945d985db85e8ab7e83699d7692eb444ce361b8f052cf84"
  norm: "norm-v1"
