  derived: true
  justification: "Проверяемая настройка п.8.4 — LogLevel VERBOSE в основном /etc/ssh/sshd_config; значение INFO, DEBUG и прочие уровни — несоответствие (решение пользователя 30.09.2026). Анализ журналов, команды grep и fail2ban — рекомендации вне продукта."
  applicability: "technical"
parameter:
  kind: "sshd-config-option"
  locator: "/etc/ssh/sshd_config"
  key: "LogLevel"
expected:
  op: "eq"
  value: "VERBOSE"
  type: "string"
apply:
  supported: true
