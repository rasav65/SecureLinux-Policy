id: "FSTEC-CONFIGURATION-2026-8.4-SSH-LOG-LEVEL"
layer: "fstec-core"
profile: null
source:
  index_id: "SRC-0091"
  doc_id: "fstec-configuration-2026"
  doc_sha256: "1f2e53a3c047cd1a21f2f99e8605f7ba7a7680a45fc332b8236199b049c3dad6"
  locator: "8.4"
  quote: "8.4 Организовать мониторинг событий SSH-доступа и анализ полученных событий. В операционной системе Linux SSH-логирование осуществляется с использованием утилиты sshd, а события записываются в системный журнал. Основные файлы, содержащие записи событий представлены в таблице 3. Файл Назначение Таблица 3. Дистрибутив /var/log/auth.log Аутентификация, включая Debian, Ubuntu SSH /var/log/secure Аналогично (аутентификация, sudo) RHEL, CentOS, Rocky journalctl -u ssh Лог systemd-юнита SSHD Все systemd-дистрибутивы По умолчанию sshd осуществляет запись следующих событий: успешные и неуспешные попытки входа; ошибки аутентификации (неверный логин, пароль, ключ); попытки входа с отключёнными пользователями; использование команд sudo, su, scp, sftp. Пример строк в файле /var/log/auth.log: Jun 18 12:43:22 server sshd[17245]: Accepted password for alice from 192.168.1.25 port 52914 ssh2; Jun 18 12:45:00 server sshd[17252]: Failed password for invalid user admin from 192.168.1.30 port 52788 ssh2. Настройку уровня записи событий возможно осуществить путем внесения следующих изменений в файл конфигурации: /etc/ssh/sshd_config: LogLevel VERBOSE. В качестве дополнительных уровней допускается использование: QUIET, FATAL, ERROR — минимальные; INFO — по умолчанию; VERBOSE — включает запись ключей при аутентификации (без самих ключей). Для того, чтобы применить настройки, необходимо выполнить следующую команду в терминале: sudo systemctl restart sshd. Для ручного анализа SSH-логов рекомендуется использовать следующие команды: grep \"Accepted\" /var/log/auth.log (для нахождения всех успешных авторизаций); grep \"Failed password\" /var/log/auth.log (для нахождения всех неудачных авторизаций); Подсчёт количества попыток по IP: grep \"Failed password\" /var/log/auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -nr (для подсчета количества попыток авторизации по IP); Подсчёт по пользователям: grep \"Failed password\" /var/log/auth.log | awk '{print $(NF-5)}' | sort | uniq -c | sort -nr (для подсчета количества попыток авторизации по пользователям); Для автоматического анализа записей событий SSH рекомендуется использовать утилиту fail2ban, которая также автоматически блокирует IP-адреса с частыми ошибками входа. Для установки fail2ban необходимо выполнить следующие команды в терминале: Для Debian/Ubuntu-подобных систем: sudo apt install fail2ban; Для RHEL-подобных систем: sudo yum install fail2ban; Для настройки указанного инструмента необходимо выполнить следующие изменения в файле конфигурации /etc/fail2ban/jail.local: [sshd] enabled = true port = ssh filter = sshd logpath = /var/log/auth.log maxretry = 5 bantime = 3600. Для более глубокого аудита рекомендовано использовать утилиту Auditd со следующими правилами: auditctl -w /usr/sbin/sshd -p x -k ssh_exec; ausearch -k ssh_exec."
  quote_sha256: "a40740a4d2f728fd1f16a2e48ceb6c2ee8a49ec3eefa633d17b13af7863411c6"
  norm: "norm-v1"
